<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inktnz // terminal</title>
    <style>
        :root {
            --bg-color: #08080a;
            --card-bg: rgba(18, 18, 24, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-red: #ff2a5f;
            --accent-purple: #9d4edd;
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(255, 42, 95, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(157, 78, 221, 0.06) 0%, transparent 50%);
        }

        /* CRT Scanline effect overlay */
        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
            opacity: 0.6;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            z-index: 1;
        }

        /* Profile Card */
        .profile {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin-bottom: 16px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
            box-shadow: 0 0 25px rgba(255, 42, 95, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .avatar-wrapper:hover .avatar {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 42, 95, 0.6);
        }

        .status-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 14px;
            height: 14px;
            background-color: #10b981;
            border: 2px solid var(--bg-color);
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        .username {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #fff 30%, var(--accent-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Courier New', Courier, monospace;
        }

        .bio {
            font-size: 0.9rem;
            color: var(--text-dim);
            max-width: 320px;
            line-height: 1.4;
        }

        /* Links List */
        .links-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            text-decoration: none;
            backdrop-filter: blur(12px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 3px; height: 100%;
            background: var(--accent-red);
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .link-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 42, 95, 0.4);
            background: rgba(25, 25, 35, 0.85);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .link-card:hover::before {
            opacity: 1;
        }

        .link-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-icon {
            font-size: 1.25rem;
        }

        .link-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .link-sub {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .arrow {
            color: var(--text-dim);
            font-size: 0.9rem;
            transition: transform 0.25s ease, color 0.25s ease;
        }

        .link-card:hover .arrow {
            transform: translateX(4px);
            color: var(--accent-red);
        }

        /* Hardware Accordion / Footer Section */
        .specs-box {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(12px);
            margin-top: 8px;
        }

        .specs-header {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            margin-bottom: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .specs-header::before {
            content: '>';
            color: var(--accent-red);
            font-family: monospace;
        }

        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.8rem;
        }

        .spec-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .spec-label {
            color: var(--text-dim);
            font-size: 0.7rem;
            display: block;
        }

        .spec-value {
            font-weight: 600;
            color: #e5e7eb;
        }

        footer {
            margin-top: 12px;
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Header / Avatar -->
        <div class="profile">
            <div class="avatar-wrapper">
                <img src="avatar.gif" alt="Avatar" class="avatar">
                <div class="status-badge" title="Online"></div>
            </div>
            <h1 class="username">inktnz.8.8.8</h1>
            <p class="bio">Hardware PRO // Simracer // F1 Fan</p>
        </div>

        <!-- Social / Project Links -->
        <div class="links-group">
            
            <a href="https://t.me/bez_sta" target="_blank" class="link-card">
                <div class="link-info">
                    <span class="link-icon">💬</span>
                    <div>
                        <div class="link-title">Telegram</div>
                        <div class="link-sub">@bez_sta</div>
                    </div>
                </div>
                <span class="arrow">→</span>
            </a>

            <a href="https://github.com/xersho" target="_blank" class="link-card">
                <div class="link-info">
                    <span class="link-icon">💻</span>
                    <div>
                        <div class="link-title">GitHub</div>
                        <div class="link-sub">xersho / inkotenza-site</div>
                    </div>
                </div>
                <span class="arrow">→</span>
            </a>

            <a href="https://steamcommunity.com" target="_blank" class="link-card">
                <div class="link-info">
                    <span class="link-icon">🎮</span>
                    <div>
                        <div class="link-title">Steam</div>
                        <div class="link-sub">Main Account</div>
                    </div>
                </div>
                <span class="arrow">→</span>
            </a>

        </div>

        <!-- Tech Specs Widget -->
        <div class="specs-box">
            <div class="specs-header">SYSTEM_RIG_SPECS</div>
            <div class="specs-grid">
                <div class="spec-item">
                    <span class="spec-label">CPU</span>
                    <span class="spec-value">AMD Ryzen 5 7600X</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">GPU</span>
                    <span class="spec-value">Palit RTX 5070 Infinity 3</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">RAM</span>
                    <span class="spec-value">Patriot Viper Venom 32GB DDR5 CL30</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">DISPLAY</span>
                    <span class="spec-value">AOC 27' 240Hz Curved (1500R)</span>
                </div>
            </div>
        </div>

        <footer>
            [SYSTEM_OK // 2026]
        </footer>

    </div>

</body>
</html>
